name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment): a tag can be moved, a
# commit cannot. Dependabot proposes updates (.github/dependabot.yml).
env:
  UV_VERSION: "0.11.23"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Live-service tests are opt-in (GEOPRODUCT_LIVE_TESTS=1) and never run here.
      - run: uv run pytest

  package:
    name: Build and check the packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv build --all-packages --out-dir dist
      - run: uv run --no-project python .github/scripts/check_dist.py dist
      # Install the wheels alone, as a user would, and run them from outside the source tree.
      - name: Run the installed packages
        run: |
          uv venv "$RUNNER_TEMP/wheels"
          uv pip install --python "$RUNNER_TEMP/wheels" dist/*.whl
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheels/bin/geoproduct-mcp" --help > /dev/null
          "$RUNNER_TEMP/wheels/bin/geoproduct" --workspace "$RUNNER_TEMP/ws" run examples/pipelines/hospitals.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
