name: Feature request
description: Suggest a capability, check, stage or provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The research or dataset task, and where the current tools fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: provider
    attributes:
      label: For a new provider
      description: Its terms of use, rate limits, licence of results, and whether it needs a key or payment.
