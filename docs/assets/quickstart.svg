<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Running the hospitals example</title>
  <desc id="desc">A terminal runs "uv run geoproduct run examples/pipelines/hospitals.yaml". All ten stages succeed: facilities, tidy, merged, buildings, matched, scored, validation, report, gate and geojson. A second command prints the quality report's score: 0.95.</desc>
  <defs>
    <clipPath id="type-1"><rect x="24" y="58" width="0" height="22">
      <animate attributeName="width" from="0" to="480" begin="0.4s" dur="1.3s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type-2"><rect x="24" y="366" width="0" height="22">
      <animate attributeName="width" from="0" to="520" begin="5.0s" dur="1.6s" fill="freeze"/>
    </rect></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; fill: #c9d1d9; white-space: pre; }
      .prompt { fill: #3fb950; font-weight: 700; }
      .cmd { fill: #f0f6fc; }
      .dim { fill: #7d8590; }
      .ok { fill: #3fb950; }
      .stage { fill: #79c0ff; }
      .score { fill: #e3b341; }
    </style>
  </defs>

  <rect width="900" height="470" rx="14" fill="#0d1117"/>
  <rect width="900" height="36" rx="14" fill="#161b22"/>
  <rect y="22" width="900" height="14" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="none" stroke="#30363d"/>
  <text x="450" y="23" text-anchor="middle" class="dim">~/geoproduct-engineer-skill</text>

  <g xml:space="preserve">
    <g clip-path="url(#type-1)">
      <text x="24" y="74"><tspan class="prompt">$</tspan><tspan class="cmd"> uv run geoproduct run examples/pipelines/hospitals.yaml</tspan></text>
    </g>

    <g opacity="0"><set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>
      <text x="24" y="98">Run run_01m8cvg09qk49wvxxgrmpt3cjb started (hospitals).</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
      <text x="24" y="118">Run run_01m8cvg09qk49wvxxgrmpt3cjb (hospitals): <tspan class="ok">succeeded</tspan></text></g>

    <g opacity="0"><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
      <text x="24" y="142"><tspan class="stage">  facilities </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      5</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.55s" fill="freeze"/>
      <text x="24" y="162"><tspan class="stage">  tidy       </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      5</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.7s" fill="freeze"/>
      <text x="24" y="182"><tspan class="stage">  merged     </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      5</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.85s" fill="freeze"/>
      <text x="24" y="202"><tspan class="stage">  buildings  </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>     60  <tspan class="dim">out</tspan>     60</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.0s" fill="freeze"/>
      <text x="24" y="222"><tspan class="stage">  matched    </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      5</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.15s" fill="freeze"/>
      <text x="24" y="242"><tspan class="stage">  scored     </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      5</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.3s" fill="freeze"/>
      <text x="24" y="262"><tspan class="stage">  validation </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      1</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.45s" fill="freeze"/>
      <text x="24" y="282"><tspan class="stage">  report     </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      1  <tspan class="dim">out</tspan>      2</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.6s" fill="freeze"/>
      <text x="24" y="302"><tspan class="stage">  gate       </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      1  <tspan class="dim">out</tspan>      1</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.75s" fill="freeze"/>
      <text x="24" y="322"><tspan class="stage">  geojson    </tspan>      <tspan class="ok">succeeded</tspan>  <tspan class="dim">in</tspan>      5  <tspan class="dim">out</tspan>      2</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.95s" fill="freeze"/>
      <text x="24" y="342" class="dim">  folder: ~/geoproduct-engineer-skill/.geoproduct/runs/run_01m8cvg09qk49wvxxgrmpt3cjb</text></g>

    <g clip-path="url(#type-2)">
      <text x="24" y="382"><tspan class="prompt">$</tspan><tspan class="cmd"> grep -m1 Score .geoproduct/runs/*/stages/report/hospitals.md</tspan></text>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="6.9s" fill="freeze"/>
      <text x="24" y="406"><tspan class="score">**Score: 0.95**</tspan> (clean records count 1, records with only warnings count 0.75,</text>
      <text x="24" y="426"> records with errors count 0).</text></g>

    <g opacity="0"><set attributeName="opacity" to="1" begin="7.2s" fill="freeze"/>
      <text x="24" y="450"><tspan class="prompt">$</tspan></text>
      <rect x="38" y="439" width="8" height="15" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="7.2s" repeatCount="indefinite"/>
      </rect></g>
  </g>
</svg>
