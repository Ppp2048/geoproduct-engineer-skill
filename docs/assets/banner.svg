<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">GeoProduct Engineer</title>
  <desc id="desc">Evidence-backed geographic datasets for AI agents: an Agent Skill, an MCP server and a pipeline engine. A stylised map shows records matched to building footprints with different levels of certainty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#14223f"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#b9d4ff"/>
    </linearGradient>
    <clipPath id="map-clip"><rect x="690" y="36" width="470" height="268" rx="14"/></clipPath>
    <pattern id="park" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#10251d"/>
      <circle cx="4" cy="4" r="1.2" fill="#1d4a33"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="13" font-weight="600" letter-spacing="2.5" fill="#58a6ff">OPEN-SOURCE TOOLKIT FOR AI AGENTS</text>
    <text x="62" y="164" font-size="54" font-weight="700" fill="url(#title-fill)">GeoProduct Engineer</text>
    <text x="64" y="206" font-size="20" fill="#9fb3d1">Research, build, check and deliver geographic datasets</text>
    <text x="64" y="234" font-size="20" fill="#9fb3d1">in which every location and value carries its evidence.</text>

    <g font-size="14" fill="#dbe7f7">
      <rect x="64" y="262" width="118" height="32" rx="16" fill="#1a2747" stroke="#2c3f68"/>
      <circle cx="84" cy="278" r="5" fill="#a371f7"/>
      <text x="96" y="283">Agent Skill</text>

      <rect x="194" y="262" width="118" height="32" rx="16" fill="#1a2747" stroke="#2c3f68"/>
      <circle cx="214" cy="278" r="5" fill="#58a6ff"/>
      <text x="226" y="283">MCP server</text>

      <rect x="324" y="262" width="146" height="32" rx="16" fill="#1a2747" stroke="#2c3f68"/>
      <circle cx="344" cy="278" r="5" fill="#3fb950"/>
      <text x="356" y="283">Pipeline engine</text>
    </g>
  </g>

  <!-- Map -->
  <rect x="690" y="36" width="470" height="268" rx="14" fill="#0e1830" stroke="#25395f"/>
  <g clip-path="url(#map-clip)">
    <!-- Streets: the gaps between blocks, with a faint centre line -->
    <g stroke="#1a2a49" stroke-width="1" stroke-dasharray="4 6">
      <line x1="690" y1="124" x2="1160" y2="124"/>
      <line x1="690" y1="212" x2="1160" y2="212"/>
      <line x1="806" y1="36" x2="806" y2="304"/>
      <line x1="922" y1="36" x2="922" y2="304"/>
      <line x1="1038" y1="36" x2="1038" y2="304"/>
    </g>

    <!-- Park block -->
    <rect x="1068" y="220" width="82" height="76" rx="6" fill="url(#park)" stroke="#1f4d36"/>

    <!-- Building footprints -->
    <g fill="#18284a" stroke="#2e4677" stroke-width="1.2">
      <rect x="700" y="46" width="44" height="34"/>
      <rect x="752" y="46" width="44" height="64"/>
      <rect x="700" y="88" width="44" height="26"/>

      <path d="M816 46 h44 v30 h-20 v34 h-24 z"/>
      <rect x="868" y="46" width="44" height="64"/>

      <rect x="932" y="46" width="34" height="64"/>
      <rect x="976" y="46" width="52" height="28"/>
      <rect x="976" y="82" width="52" height="28"/>

      <rect x="1046" y="46" width="50" height="40"/>
      <rect x="1104" y="46" width="46" height="64"/>
      <rect x="1046" y="94" width="50" height="16"/>

      <rect x="700" y="134" width="96" height="30"/>
      <rect x="700" y="172" width="44" height="30"/>
      <rect x="752" y="172" width="44" height="30"/>

      <rect x="816" y="134" width="96" height="68"/>

      <rect x="932" y="134" width="44" height="68"/>
      <rect x="984" y="134" width="44" height="68"/>

      <rect x="1046" y="134" width="104" height="30"/>
      <rect x="1046" y="172" width="60" height="30"/>

      <rect x="700" y="222" width="60" height="72"/>
      <rect x="768" y="222" width="28" height="72"/>

      <rect x="816" y="222" width="44" height="34"/>
      <rect x="868" y="222" width="44" height="72"/>
      <rect x="816" y="264" width="44" height="30"/>

      <rect x="932" y="222" width="96" height="34"/>
    </g>

    <!-- exact: inside a footprint, confirmed -->
    <rect x="816" y="134" width="96" height="68" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" stroke-width="2"/>
    <circle cx="864" cy="168" r="6" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="r" values="6;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="864" cy="168" r="5.5" fill="#3fb950" stroke="#f0f6fc" stroke-width="1.5"/>

    <!-- probable: inside a footprint, unconfirmed -->
    <rect x="868" y="46" width="44" height="64" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="890" cy="84" r="5.5" fill="#d29922" stroke="#f0f6fc" stroke-width="1.5"/>

    <!-- ambiguous: between two equally likely footprints -->
    <rect x="932" y="134" width="44" height="68" fill="#a371f7" fill-opacity="0.1" stroke="#a371f7" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="984" y="134" width="44" height="68" fill="#a371f7" fill-opacity="0.1" stroke="#a371f7" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="980" cy="168" r="5.5" fill="#a371f7" stroke="#f0f6fc" stroke-width="1.5"/>

    <!-- approximate_point: near a footprint, not inside it -->
    <circle cx="952" cy="268" r="16" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="952" cy="268" r="5.5" fill="#58a6ff" stroke="#f0f6fc" stroke-width="1.5"/>

    <!-- none: no footprint within reach -->
    <circle cx="1109" cy="262" r="22" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="1109" cy="262" r="5.5" fill="#8b949e" stroke="#f0f6fc" stroke-width="1.5"/>

    <!-- Labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="822" y="181" width="50" height="18" rx="4" fill="#0a1120" fill-opacity="0.85"/>
      <text x="828" y="194" fill="#3fb950">exact</text>
      <rect x="854" y="112" width="72" height="18" rx="4" fill="#0a1120" fill-opacity="0.85"/>
      <text x="860" y="125" fill="#d29922">probable</text>
      <rect x="938" y="112" width="80" height="18" rx="4" fill="#0a1120" fill-opacity="0.85"/>
      <text x="944" y="125" fill="#a371f7">ambiguous</text>
      <rect x="972" y="259" width="92" height="18" rx="4" fill="#0a1120" fill-opacity="0.85"/>
      <text x="978" y="272" fill="#58a6ff">approximate</text>
      <rect x="1087" y="226" width="44" height="18" rx="4" fill="#0a1120" fill-opacity="0.85"/>
      <text x="1093" y="239" fill="#c9d1d9">none</text>
    </g>
  </g>
</svg>
