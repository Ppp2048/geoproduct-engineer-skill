# Workspace root: development tooling only. The installable parts live in packages/.
[project]
name = "geoproduct-engineer-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
geoproduct-core = { workspace = true }
geoproduct-mcp = { workspace = true }

[dependency-groups]
dev = [
    "geoproduct-core",
    "geoproduct-mcp",
    "jsonschema>=4.26",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20261113",
    "types-shapely>=2.2.0.20261117",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["geoproduct", "geoproduct_mcp"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["live: calls live external services; opt in with GEOPRODUCT_LIVE_TESTS=1"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/geoproduct-core/src",
    "packages/geoproduct-mcp/src",
    "skills/geoproduct-engineer/scripts",
    "tests/skill",
    "tests/e2e",
    "tests/live",
]
